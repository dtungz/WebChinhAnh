<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge - Image Compressor & Pixel Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>PixelForge</span>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg class="sun-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Tabs Navigation -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="compress">Compress Image</button>
                <button class="tab-btn" data-tab="pixelate">Pixel Art</button>
            </div>

            <div class="workspace-grid">
                <!-- Left Sidebar: Controls -->
                <aside class="controls-panel glass-card">
                    
                    <!-- Upload Zone -->
                    <div id="uploadZone" class="upload-zone">
                        <input type="file" id="fileInput" accept="image/*" hidden>
                        <div class="upload-content">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            <p class="upload-title">Drop your image here</p>
                            <p class="upload-subtitle">or click to browse (Max: 20MB)</p>
                        </div>
                    </div>

                    <!-- Error Message Container -->
                    <div id="errorBox" class="error-box hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        <span id="errorText"></span>
                    </div>

                    <!-- Compress Controls -->
                    <div id="compressControls" class="control-group">
                        <div class="control-item">
                            <div class="control-header">
                                <label for="qualitySlider">Quality</label>
                                <span id="qualityValue">80%</span>
                            </div>
                            <input type="range" id="qualitySlider" min="1" max="100" value="80">
                        </div>
                        <div class="control-item">
                            <div class="control-header">
                                <label for="formatSelect">Format</label>
                            </div>
                            <div class="select-wrapper">
                                <select id="formatSelect">
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/webp">WebP</option>
                                    <option value="image/png">PNG</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Pixelate Controls -->
                    <div id="pixelateControls" class="control-group hidden">
                        <div class="control-item">
                            <div class="control-header">
                                <label for="pixelSizeSlider">Pixel Size</label>
                                <span id="pixelSizeValue">8px</span>
                            </div>
                            <input type="range" id="pixelSizeSlider" min="2" max="64" value="8" step="2">
                        </div>
                    </div>

                    <!-- Info Box -->
                    <div id="fileInfo" class="file-info hidden">
                        <div class="info-row">
                            <span class="info-label">Original</span>
                            <span id="originalSize" class="info-value">0 KB</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Processed</span>
                            <span id="processedSize" class="info-value highlight">0 KB</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Reduction</span>
                            <span id="reductionValue" class="info-value success">-0%</span>
                        </div>
                    </div>

                    <button id="downloadBtn" class="btn primary-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Image
                    </button>
                </aside>

                <!-- Right Workspace: Image Preview -->
                <section class="preview-panel glass-card">
                    <div id="emptyState" class="empty-state">
                        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <p>No image selected</p>
                    </div>

                    <div id="previewState" class="preview-container hidden">
                        <!-- We use two canvases overlapping for before/after comparison -->
                        <div class="comparison-slider">
                            <div class="image-layer after">
                                <canvas id="processedCanvas"></canvas>
                                <span class="badge badge-after">After</span>
                            </div>
                            <div class="image-layer before">
                                <canvas id="originalCanvas"></canvas>
                                <span class="badge badge-before">Before</span>
                            </div>
                            <!-- Comparison Handle -->
                            <div class="slider-handle" id="sliderHandle">
                                <div class="slider-button">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/compressor.js"></script>
    <script src="js/pixelator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
